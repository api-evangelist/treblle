  partner: datadog
  category: Observability
  use_case: Forward Treblle per-request latency, response codes, and error rates into Datadog as custom metrics
    and events so API observability lives next to the rest of your infra dashboards.
  source: curated
  status: pending-generation
  arazzo: null
- slug: treblle-sentry
  label: Forward Treblle API errors into Sentry issues
  partner: sentry
  category: Observability
  use_case: When Treblle records a 5xx or unhandled exception on a tracked endpoint, create or update the matching
    Sentry issue with the request payload, headers, and stack context for triage.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: treblle-pagerduty
