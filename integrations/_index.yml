  partner: pagerduty
  category: Alerting
  use_case: When Treblle detects an endpoint breaching its latency or error-rate SLO, open a PagerDuty incident
    routed to the owning service so on-call gets paged with the offending request inline.
  source: curated
  status: pending-generation
  arazzo: null
